name: Flutter CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  changes:
    name: Detect Flutter changes
    runs-on: ubuntu-latest
    outputs:
      flutter: ${{ steps.detect.outputs.flutter }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Detect relevant changes
        id: detect
        run: python3 .github/scripts/flutter_changes.py

  build:
    name: Flutter tests and builds
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          # Matches the project's Dart SDK requirement (^3.13.7).
          flutter-version: '3.47.9'
          cache: true

      - name: Verify toolchain versions
        run: |
          flutter --version
          java -version
          xcodebuild -version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze source
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Check Android build
        run: flutter build apk --debug

      - name: Check iOS build
        run: flutter build ios --release --no-codesign

  required:
    name: Flutter CI required
    if: ${{ always() }}
    needs: [changes, build]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          FLUTTER_CHANGED: ${{ needs.changes.outputs.flutter }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Change detection failed or was cancelled."
            exit 1
          fi
          if [ "$FLUTTER_CHANGED" = "true" ] && [ "$BUILD_RESULT" = "success" ]; then
            echo "Flutter tests and builds passed."
          elif [ "$FLUTTER_CHANGED" = "false" ] && [ "$BUILD_RESULT" = "skipped" ]; then
            echo "No Flutter-related changes; tests and builds are not needed."
          else
            echo "Required Flutter tests and builds did not succeed."
            exit 1
          fi
