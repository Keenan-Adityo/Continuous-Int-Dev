# Copy to .github/workflows/testflight.yml after completing README.md in this folder.
name: TestFlight iOS testing

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'Build number 1–9999, higher than previous uploads for this version'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: testflight-distribution
  cancel-in-progress: false

jobs:
  upload:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 60
    environment: testflight
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      # Resolve the project's Flutter/Dart version mismatch before activation.
      FLUTTER_VERSION: ${{ vars.FLUTTER_VERSION || '3.44.5' }}
      IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      BUILD_NUMBER: ${{ inputs.build_number }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      KEYCHAIN_PATH: ${{ runner.temp }}/testflight-signing.keychain-db
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      PROFILE_PATH: ${{ runner.temp }}/distribution.mobileprovision
      API_PRIVATE_KEYS_DIR: ${{ runner.temp }}/appstore-keys
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate configuration
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]{0,3}$ ]]
          for name in IOS_BUNDLE_ID APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID KEYCHAIN_PASSWORD CERTIFICATE_BASE64 CERTIFICATE_PASSWORD PROFILE_BASE64 ASC_PRIVATE_KEY_BASE64; do
            test -n "${!name}" || { echo "Missing configuration: $name"; exit 1; }
          done
          xcodebuild -version

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Validate the selected source revision
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - name: Install Xcode project editor
        run: gem install xcodeproj --version 1.27.0 --no-document

      - name: Install distribution signing credentials
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.APPLE_PROFILE_BASE64 }}
          ASC_PRIVATE_KEY_BASE64: ${{ secrets.ASC_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          for secret, target in (
              ('CERTIFICATE_BASE64', Path(os.environ['RUNNER_TEMP']) / 'distribution.p12'),
              ('PROFILE_BASE64', Path(os.environ['PROFILE_PATH'])),
              ('ASC_PRIVATE_KEY_BASE64', Path(os.environ['API_PRIVATE_KEYS_DIR']) / f"AuthKey_{os.environ['ASC_KEY_ID']}.p8"),
          ):
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(base64.b64decode(os.environ[secret], validate=True))
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/distribution.p12" -P "$CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" "$HOME/Library/Keychains/login.keychain-db"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          python3 - <<'PY'
          import os, plistlib, shutil
          from pathlib import Path
          profile = plistlib.loads((Path(os.environ['RUNNER_TEMP']) / 'profile.plist').read_bytes())
          team, bundle = os.environ['APPLE_TEAM_ID'], os.environ['IOS_BUNDLE_ID']
          assert team in profile['TeamIdentifier'], 'Provisioning profile team mismatch'
          assert profile['Entitlements']['application-identifier'] == f'{team}.{bundle}', 'Provisioning profile bundle ID mismatch'
          assert not profile.get('ProvisionedDevices'), 'Use an App Store distribution profile'
          assert not profile.get('ProvisionsAllDevices'), 'Enterprise profiles cannot be used for TestFlight'
          assert not profile['Entitlements'].get('get-task-allow'), 'Development profiles cannot be used for TestFlight'
          target = Path.home() / 'Library/Developer/Xcode/UserData/Provisioning Profiles' / f"{profile['UUID']}.mobileprovision"
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(os.environ['PROFILE_PATH'], target)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f"IOS_PROFILE_UUID={profile['UUID']}\n")
              output.write(f"INSTALLED_PROFILE_PATH={target}\n")
          options = {'method': 'app-store-connect', 'signingStyle': 'manual',
                     'teamID': team, 'signingCertificate': 'Apple Distribution',
                     'manageAppVersionAndBuildNumber': False,
                     'provisioningProfiles': {bundle: profile['UUID']}}
          (Path(os.environ['RUNNER_TEMP']) / 'ExportOptions.plist').write_bytes(plistlib.dumps(options))
          PY

      - name: Configure Runner signing on the CI checkout
        run: |
          ruby - <<'RUBY'
          require 'xcodeproj'
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          runner = project.targets.find { |target| target.name == 'Runner' }
          abort 'Runner target not found' unless runner
          runner.build_configurations.each do |config|
            config.build_settings['PRODUCT_BUNDLE_IDENTIFIER'] = ENV.fetch('IOS_BUNDLE_ID')
            config.build_settings['DEVELOPMENT_TEAM'] = ENV.fetch('APPLE_TEAM_ID')
            config.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            config.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            config.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = ENV.fetch('IOS_PROFILE_UUID')
          end
          project.save
          RUBY

      - name: Build signed IPA
        run: |
          flutter build ipa --release --build-number="$BUILD_NUMBER" \
            --export-options-plist="$RUNNER_TEMP/ExportOptions.plist"
          # flutter build ipa can complete an archive even if IPA export fails.
          test -n "$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"

      - name: Upload to App Store Connect for TestFlight
        # Upload only. Configure internal automatic distribution in App Store Connect.
        # External groups and beta review are managed in App Store Connect.
        run: |
          set -euo pipefail
          IPA_PATH=$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)
          xcrun altool --upload-app --type ios --file "$IPA_PATH" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove temporary signing credentials
        if: ${{ always() }}
        run: |
          security delete-keychain "$KEYCHAIN_PATH" || true
          python3 - <<'PY'
          import os, shutil
          from pathlib import Path
          for path in [os.environ.get('INSTALLED_PROFILE_PATH'), os.environ['PROFILE_PATH'],
                       str(Path(os.environ['RUNNER_TEMP']) / 'distribution.p12'),
                       str(Path(os.environ['RUNNER_TEMP']) / 'profile.plist')]:
              if path:
                  Path(path).unlink(missing_ok=True)
          shutil.rmtree(os.environ['API_PRIVATE_KEYS_DIR'], ignore_errors=True)
          PY
